<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valorant Champions Istanbul</title>

    <!-- Fonte estilo gamer -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div id="navbar">
        <div class="logo-area">
          <a href="https://playvalorant.com/pt-br/">
            <img
              id="icon"
              src="assets/Valorant_logo_-_pink_color_version.svg.png"
              alt="Ícone Valorant"
            />
          </a>

          <h2 class="title">Dashboard Interativo dos Champions</h2>
        </div>

        <ul id="links">
          <li><a href="#jogos">Jogos</a></li>
          <li>
            <a href="https://www.youtube.com/@valesportsbr">Transmissão</a>
          </li>
          <li><a href="https://github.com/lucastofolalmeida">Sobre</a></li>
        </ul>
      </div>
    </header>

    <main>
      <section class="capa">
        <img
          class="champions-logo"
          src="assets/champions-istanbul.png"
          alt="Valorant Champions Istanbul"
        />

        <div class="capa-text">
          <h1>Champions Istanbul 2022</h1>
          <p>O maior campeonato competitivo de Valorant</p>
        </div>
      </section>

      <section class="page">
        <!-- Jogos-->
        <div class="interno">
          <div>aspinhas</div>
        </div>
      </section>
      <!-- Jogadores -->
      <section class="page">
        <div class="interno">
          <div class="time">
            <h2>LOUD</h2>

            <div class="players">
              <div class="jogador">
                <img class="imagem" src="assets/sacy.png" />
                <div>
                  <h3>sacy</h3>
                  <div>
                    <div class="funcao"><img src="assets/iniciador_icone.webp"></div>
                    <div>iniciador</div>
                  </div>
                </div>
              </div>
              <div class="jogador">
                <img class="imagem" src="assets/pancada.png" />
              </div>
              <div class="jogador">
                <img class="imagem" src="assets/sad.png" />
              </div>
              <div class="jogador">
                <img class="imagem" src="assets/less.png" />
              </div>
              <div class="jogador">
                <img class="imagem" src="assets/aspas.png" />
              </div>
            </div>
          </div>

          <div class="time">
            <h2>OPTIC</h2>

            <div class="players">
              <div class="jogador"><img class="imagem" src="assets/" /></div>
              <div class="jogador"><img class="imagem" src="assets/" /></div>
              <div class="jogador"><img class="imagem" src="assets/" /></div>
              <div class="jogador"><img class="imagem" src="assets/" /></div>
              <div class="jogador"><img class="imagem" src="assets/" /></div>
            </div>
          </div>

          <div class="time">
            <h2>FNATIC</h2>

            <div class="players">
              <div class="jogador"><img class="imagem" src="assets/" /></div>
              <div class="jogador"><img class="imagem" src="assets/" /></div>
              <div class="jogador"><img class="imagem" src="assets/" /></div>
              <div class="jogador"><img class="imagem" src="assets/" /></div>
              <div class="jogador"><img class="imagem" src="assets/" /></div>
            </div>
          </div>
          <div class="time">
            <h2>LEVIATÁN</h2>

            <div class="players">
              <div class="jogador"><img class="imagem" src="assets/" /></div>
              <div class="jogador"><img class="imagem" src="assets/" /></div>
              <div class="jogador"><img class="imagem" src="assets/" /></div>
              <div class="jogador"><img class="imagem" src="assets/" /></div>
              <div class="jogador"><img class="imagem" src="assets/" /></div>
            </div>
          </div>
          <div class="time">
            <h2>KIWOOM</h2>

            <div class="players">
              <div class="jogador"><img class="imagem" src="assets/" /></div>
              <div class="jogador"><img class="imagem" src="assets/" /></div>
              <div class="jogador"><img class="imagem" src="assets/" /></div>
              <div class="jogador"><img class="imagem" src="assets/" /></div>
              <div class="jogador"><img class="imagem" src="assets/" /></div>
            </div>
          </div>
          <div class="time">
            <h2>XSET</h2>

            <div class="players">
              <div class="jogador"><img class="imagem" src="assets/" /></div>
              <div class="jogador"><img class="imagem" src="assets/" /></div>
              <div class="jogador"><img class="imagem" src="assets/" /></div>
              <div class="jogador"><img class="imagem" src="assets/" /></div>
              <div class="jogador"><img class="imagem" src="assets/" /></div>
            </div>
          </div>
          <div class="time">
            <h2>LIQUID</h2>

            <div class="players">
              <div class="jogador"><img class="imagem" src="assets/" /></div>
              <div class="jogador"><img class="imagem" src="assets/" /></div>
              <div class="jogador"><img class="imagem" src="assets/" /></div>
              <div class="jogador"><img class="imagem" src="assets/" /></div>
              <div class="jogador"><img class="imagem" src="assets/" /></div>
            </div>
          </div>
          <div class="time">
            <h2>PHOENIX</h2>

            <div class="players">
              <div class="jogador"><img class="imagem" src="assets/" /></div>
              <div class="jogador"><img class="imagem" src="assets/" /></div>
              <div class="jogador"><img class="imagem" src="assets/" /></div>
              <div class="jogador"><img class="imagem" src="assets/" /></div>
              <div class="jogador"><img class="imagem" src="assets/" /></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="main.js"></script>
  </body>
</html>
